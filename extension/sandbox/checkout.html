<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Razorpay Checkout</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: transparent;
      }
      #boot-error {
        display: none;
        padding: 16px;
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #b91c1c;
      }
    </style>
  </head>
  <body>
    <div id="boot-error">
      Razorpay checkout could not load. Check your internet connection and try
      again.
    </div>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
      (function () {
        var BOOT_ERROR = document.getElementById("boot-error");
        var nonce = null;

        function post(type, payload) {
          try {
            window.parent.postMessage(
              { type: type, nonce: nonce, payload: payload || {} },
              "*"
            );
          } catch (e) {
            // parent frame gone
          }
        }

        window.addEventListener("message", function (event) {
          var data = event.data;
          if (!data || data.type !== "init") return;

          nonce = data.nonce;

          if (typeof window.Razorpay === "undefined") {
            BOOT_ERROR.style.display = "block";
            post("checkout.error", {
              message: "Razorpay checkout failed to load",
            });
            return;
          }

          var options = data.options || {};
          var checkout;

          try {
            checkout = new window.Razorpay({
              key: options.key,
              amount: options.amount,
              currency: options.currency,
              name: options.name || "",
              description: options.description || "",
              order_id: options.order_id,
              prefill: options.prefill || {},
              theme: options.theme || {},
              handler: function (response) {
                post("checkout.success", response);
              },
              modal: {
                ondismiss: function () {
                  post("checkout.dismissed");
                },
              },
            });
          } catch (e) {
            post("checkout.error", { message: e.message || "Checkout error" });
            return;
          }

          checkout.on("payment.failed", function (response) {
            post("checkout.failed", response);
          });

          checkout.open();
        });
      })();
    </script>
  </body>
</html>
